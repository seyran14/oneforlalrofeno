name: Deploy bot worker

# Deploys bot-worker/ to Cloudflare Workers whenever its code changes on main,
# so the bot can be updated without a laptop. Repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Edit Cloudflare Workers" permission
#   NOTION_TOKEN          — Notion integration token, uploaded as a worker secret
# The account is pinned in bot-worker/wrangler.toml.

on:
  push:
    branches: [main]
    paths:
      - 'bot-worker/**'
      - '.github/workflows/deploy-bot-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: bot-worker
          # Pushed to the worker on every deploy, so the two stay in sync.
          secrets: |
            NOTION_TOKEN
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
