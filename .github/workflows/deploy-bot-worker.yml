name: Deploy bot worker

# Deploys bot-worker/ to Cloudflare Workers whenever its code changes on main,
# so the bot can be updated without a laptop. Needs one repository secret:
#   CLOUDFLARE_API_TOKEN  — token with the "Edit Cloudflare Workers" permission
# Optional, only if the token can see more than one account:
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
    paths:
      - 'bot-worker/**'
      - '.github/workflows/deploy-bot-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot-worker
