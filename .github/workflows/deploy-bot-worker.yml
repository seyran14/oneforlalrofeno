name: Deploy bot worker

# Deploys bot-worker/ to Cloudflare Workers whenever its code changes on main,
# so the bot can be updated without a laptop. Repository secrets:
#   CLOUDFLARE_API_TOKEN  — token with the "Edit Cloudflare Workers" permission
#   NOTION_TOKEN          — Notion integration token, uploaded as a worker secret
#   UPLOAD_SECRET         — key for the /upload page, uploaded as a worker secret
# The account is pinned in bot-worker/wrangler.toml.

on:
  push:
    branches: [main]
    paths:
      - 'bot-worker/**'
      - '.github/workflows/deploy-bot-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Idempotent: harmless once the bucket exists, and a no-op while R2 is
      # still switched off for the account.
      - name: Ensure the R2 bucket exists
        continue-on-error: true
        run: npx --yes wrangler@4 r2 bucket create seyran-media
        working-directory: bot-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: bot-worker
          # Pushed to the worker on every deploy, so the two stay in sync.
          secrets: |
            NOTION_TOKEN
            UPLOAD_SECRET
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
